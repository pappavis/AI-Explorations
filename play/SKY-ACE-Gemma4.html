<!DOCTYPE html>
<html lang="af">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKY ACE Gemma4</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            border: 4px solid #4e4e9c;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            background-color: #16213e;
            cursor: crosshair;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
            text-shadow: 2px 2px 2px #000;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.1s;
            margin-top: 20px;
        }

        button:hover {
            transform: scale(1.05);
            background: #ff4d6d;
        }

        .stats {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div class="stats">Lewens: <span id="lives">3</span></div>
            <div class="stats">Skoor: <span id="score">0</span> (x<span id="multiplier">1</span>)</div>
            <div class="stats">Golf: <span id="wave">1</span></div>
            <div class="stats">Missiele: <span id="missiles">10</span></div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="overlay">
            <h1 id="title">SKY ACE Gemma4</h1>
            <p id="description">Gebruik WASD om te vlieg, Muis om te mik, Klik vir Masjinstoweel, Ruimte vir Missiele.</p>
            <div id="best-score-display">Beste Skoor: <span id="best-score">0</span></div>
            <button id="start-btn">Begin Speel</button>
        </div>
    </div>

<script>
/**
 * SKY ACE Gemma4 - Game Logic
 * Language: Afrikaans
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiScore = document.getElementById('score');
const uiMultiplier = document.getElementById('multiplier');
const uiLives = document.getElementById('lives');
const uiWave = document.getElementById('wave');
const uiMissiles = document.getElementById('missiles');
const uiBestScore = document.getElementById('best-score');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start-btn');
const title = document.getElementById('title');
const description = document.getElementById('description');

// Game Constants & State
let score = 0;
let multiplier = 1;
let consecutiveKills = 0;
let lives = 3;
let wave = 1;
let bestScore = localStorage.getItem('skyAceBestScore') || 0;
uiBestScore.innerText = bestScore;

let gameState = 'menu'; // menu, playing, gameover
let particles = [];
let bullets = [];
let enemies = [];
let groundGuns = [];
let clouds = [];
let shake = 0;

const player = {
    x: 400,
    y: 300,
    vx: 0,
    vy: 0,
    angle: 0,
    speed: 0,
    maxSpeed: 5,
    accel: 0.2,
    friction: 0.98,
    radius: 15,
    missiles: 10,
    color: '#e94560'
};

// Input Handling
const keys = {};
let mouse = { x: 400, y: 300 };

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);
window.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});

window.addEventListener('mousedown', () => {
    if (gameState === 'playing') {
        fireMachineGun();
    }
});

window.addEventListener('keydown', e => {
    if (e.code === 'Space' && gameState === 'playing' && player.missiles > 0) {
        fireMissile();
    }
});

// Entity Classes
class Bullet {
    constructor(x, y, angle, speed, type = 'machine') {
        this.x = x;
        this.y = y;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.type = type;
        this.life = 100;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
    }
    draw() {
        ctx.fillStyle = this.type === 'machine' ? '#fff' : '#ffcc00';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.type === 'machine' ? 3 : 6, 0, Math.PI * 2);
        ctx.fill();
    }
}

class Enemy {
    constructor(x, y, type = 'scout') {
        this.x = x;
        this.y = y;
        this.type = type;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.hp = type === 'heavy' ? 3 : 1;
        this.radius = type === 'heavy' ? 20 : 12;
        this.color = type === 'heavy' ? '#4e4e9c' : '#ff4d6d';
        this.angle = 0;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.angle += 0.02;

        // Bounce off walls
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
    }
    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.moveTo(this.radius, 0);
        ctx.lineTo(-this.radius, -this.radius);
        ctx.lineTo(-this.radius, this.radius);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
}

class GroundGun {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.timer = 0;
        this.fireRate = 60 + Math.random() * 40;
    }
    update() {
        this.timer++;
        if (this.timer % this.fireRate === 0) {
            const angleToPlayer = Math.atan2(player.y - this.y, player.x - this.x);
            bullets.push(new Bullet(this.x, this.y, angleToPlayer, 4, 'machine'));
        }
    }
    draw() {
        ctx.fillStyle = '#777';
        ctx.fillRect(this.x - 10, this.y - 10, 20, 20);
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
        this.life = 1.0;
        this.decay = 0.02;
        this.color = color;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
    }
    draw() {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

// Helper Functions
function fireMachineGun() {
    const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    bullets.push(new Bullet(player.x, player.y, angle, 8, 'machine'));
}

function fireMissile() {
    const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    bullets.push(new Bullet(player.x, player.y, angle, 12, 'missile'));
    player.missiles--;
    uiMissiles.innerText = player.missiles;
}

function createExplosion(x, y, color) {
    for (let i = 0; i < 10; i++) {
        particles.push(new Particle(x, y, color));
    }
    shake = 10;
}

function spawnWave() {
    enemies = [];
    const count = 3 + wave * 2;
    for (let i = 0; i < count; i++) {
        const x = Math.random() * (canvas.width - 100) + 50;
        const y = Math.random() * (canvas.height - 100) + 50;
        const type = Math.random() > 0.7 ? 'heavy' : 'scout';
        enemies.push(new Enemy(x, y, type));
    }
    groundGuns = [];
    for (let i = 0; i < 4; i++) {
        groundGuns.push(new GroundGun(Math.random() * canvas.width, Math.random() * canvas.height));
    }
    uiWave.innerText = wave;
}

// Game Loop
function update() {
    if (gameState !== 'playing') return;

    // Player Movement
    if (keys['KeyW']) {
        player.vx += Math.cos(player.angle) * player.accel;
        player.vy += Math.sin(player.angle) * player.accel;
    }
    if (keys['KeyS']) {
        player.vx -= Math.cos(player.angle) * player.accel;
        player.vy -= Math.sin(player.angle) * player.accel;
    }
    if (keys['KeyA']) player.angle -= 0.05;
    if (keys['KeyD']) player.angle += 0.05;

    player.vx *= player.friction;
    player.vy *= player.friction;
    player.x += player.vx;
    player.y += player.vy;

    // Update Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].update();
        if (bullets[i].life <= 0) bullets.splice(i, 1);
    }

    // Update Enemies
    enemies.forEach((en, index) => {
        en.update();
        // Collision with bullets
        bullets.forEach((b, bIndex) => {
            const dist = Math.hypot(en.x - b.x, en.y - b.y);
            if (dist < en.radius + 5) {
                en.hp -= 1;
                bullets.splice(bIndex, 1);
                if (en.hp <= 0) {
                    createExplosion(en.x, en.y, en.color);
                    enemies.splice(index, 1);
                    score += 10 * multiplier;
                    consecutiveKills++;
                    if (consecutiveKills % 5 === 0) multiplier++;
                    uiScore.innerText = score;
                    uiMultiplier.innerText = multiplier;
                }
            }
        });
    });

    // Check for Wave Clear
    if (enemies.length === 0) {
        wave++;
        spawnWave();
    }

    // Ground Guns
    groundGuns.forEach(g => g.update());

    // Player vs Ground Guns
    bullets.forEach((b, bIdx) => {
        const dist = Math.hypot(player.x - b.x, player.y - b.y);
        if (dist < player.radius) {
            bullets.splice(bIdx, 1);
            lives--;
            uiLives.innerText = lives;
            createExplosion(player.x, player.y, '#fff');
            if (lives <= 0) {
                gameState = 'gameover';
                title.innerText = "Spelet Oor!";
                description.innerText = `Jou finale skoor: ${score}`;
                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('skyAceBestScore', bestScore);
                    uiBestScore.innerText = bestScore;
                }
                overlay.classList.remove('hidden');
            }
        }
    });

    // Particles
    particles.forEach((p, i) => {
        p.update();
        if (p.life <= 0) particles.splice(i, 1);
    });

    if (shake > 0) shake *= 0.9;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Screen Shake
    ctx.save();
    if (shake > 0.5) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    // Draw Clouds (Static-ish)
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
        ctx.fill();
    });

    // Draw Ground Guns
    groundGuns.forEach(g => g.draw());

    // Draw Enemies
    enemies.forEach(en => en.draw());

    // Draw Bullets
    bullets.forEach(b => b.draw());

    // Draw Particles
    particles.forEach(p => p.draw());

    // Draw Player
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);
    ctx.fillStyle = player.color;
    ctx.beginPath();
    ctx.moveTo(player.radius, 0);
    ctx.lineTo(-player.radius, -player.radius);
    ctx.lineTo(-player.radius, player.radius);
    ctx.closePath();
    ctx.fill();
    // Cockpit
    ctx.fillStyle = '#fff';
    ctx.fillRect(-2, -2, 4, 4);
    ctx.restore();

    ctx.restore();
    requestAnimationFrame(() => {
        update();
        draw();
    });
}

// Init
function init() {
    // Generate some clouds
    for (let i = 0; i < 20; i++) {
        clouds.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: 30 + Math.random() * 50
        });
    }
    spawnWave();
    draw();
}

startBtn.addEventListener('click', () => {
    score = 0;
    lives = 3;
    wave = 1;
    multiplier = 1;
    player.missiles = 10;
    bullets = [];
    enemies = [];
    particles = [];
    gameState = 'playing';
    overlay.classList.add('hidden');
    uiScore.innerText = "0";
    uiLives.innerText = "3";
    uiWave.innerText = "1";
    uiMissiles.innerText = "10";
    uiMultiplier.innerText = "1";
    spawnWave();
});

init();
</script>
</body>
</html>
