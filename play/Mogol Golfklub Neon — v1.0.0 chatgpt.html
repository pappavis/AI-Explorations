function draw(){let c=courses[courseIndex];g.clearRect(0,0,W,H);g.fillStyle='#0a2d24';g.fillRect(0,0,W,H);let r=rng(seed+holeNo*11939+300);for(let i=0;i<1700;i++){let x=r()*W,y=r()*H;g.fillStyle=i%3?'#ffffff06':'#55ff9a09';g.fillRect(x,y,2,2)}g.save();g.beginPath();g.rect(25,25,950,630);g.clip();fairway.forEach(f=>ell(f.x,f.y,f.rx,f.ry,c.color));for(let i=0;i<fairway.length;i++){let f=fairway[i];ell(f.x,f.y,f.rx*.8,f.ry*.8,i%2?'#5cac6540':'#a6e88318')}ell(cup.x,cup.y,40,40,'#61ce7b','#b4ff9b');bunkers.forEach(b=>{ell(b.x,b.y,b.rx,b.ry,c.sand,'#f4e3b6');for(let i=0;i<8;i++){let a=i*2.4;line(b.x+Math.cos(a)*b.rx*.65,b.y+Math.sin(a)*b.ry*.5,b.x+Math.cos(a)*b.rx*.65+7,b.y+Math.sin(a)*b.ry*.5+3,'#b18e5c55',1)}});waters.forEach(w=>{ell(w.x,w.y,w.rx,w.ry,'#145c9c','#54d5ff');for(let i=0;i<4;i++)ell(w.x+(i-1.5)*w.rx*.3,w.y+Math.sin(i+performance.now()*.001)*5,w.rx*.17,2,'#8aeaff66')});trees.forEach(t=>{ell(t.x+5,t.y+7,t.r,t.r*.65,'#00181099');ell(t.x,t.y,t.r,t.r,'#103e35','#1d7452');ell(t.x-4,t.y-4,t.r*.65,t.r*.65,'#2d7956');ell(t.x-7,t.y-7,t.r*.24,t.r*.24,'#66b77c')});g.restore();g.strokeStyle='#5effb1';g.lineWidth=4;g.strokeRect(25,25,950,630);g.fillStyle='#dbfffa';g.font='bold 15px system-ui';g.fillText(c.name.toUpperCase(),38,48);g.font='12px system-ui';g.fillStyle='#c6f5d8';g.fillText('PAR '+par+'  •  '+Math.round(dist({x:110,y:340},cup)*.61)+' m',38,67);g.fillStyle='#f7f7ff';ell(cup.x,cup.y,6,6,'#092521');line(cup.x,cup.y,cup.x,cup.y-46,'#fafafa',3);g.fillStyle='#ff5c9a';g.beginPath();g.moveTo(cup.x,cup.y-46);g.lineTo(cup.x+30,cup.y-36);g.lineTo(cup.x,cup.y-26);g.fill();if(state==='playing'||state==='moving'){g.setLineDash([9,8]);line(ball.x,ball.y,aim.x,aim.y,'#e5ffac9c',2);g.setLineDash([]);let angle=Math.atan2(aim.y-ball.y,aim.x-ball.x);if(state==='playing'){let range=clubs.find(c=>c[0]===$('club').value)[1]/.61*(charging?power:.7);let tx=ball.x+Math.cos(angle)*range,ty=ball.y+Math.sin(angle)*range;ell(tx,ty,12,12,'#ffffff18','#f4ffa8');g.fillStyle='#f3ffd5';g.font='13px system-ui';g.fillText(Math.round(dist(ball,cup)*.61)+'m',ball.x+13,ball.y-16)}}let a=Math.atan2(ball.y-golfer.y,ball.x-golfer.x);g.save();g.translate(golfer.x,golfer.y);g.rotate(a);ell(0,0,12,8,'#07131d99');ell(0,0,8,8,'#ffce92');g.fillStyle='#fa5b9e';g.fillRect(-6,-6,12,12);g.fillStyle='#eaffff';g.fillRect(3,-4,9,4);g.restore();ell(ball.x+2,ball.y+4,5,3,'#001b1f99');ell(ball.x,ball.y-ball.z,4.8,4.8,'#fff','#d6e6ed');if(charging){g.fillStyle='#fff';g.font='bold 16px system-ui';g.fillText(Math.round(power*100)+'%',ball.x+15,ball.y-29)}g.fillStyle='#d5f8f7';g.font='bold 13px system-ui';g.fillText('↗ '+Math.round(Math.hypot(wind.x,wind.y))+' km/h',820,48);if(state==='holed'){g.fillStyle='#7bffe5';g.font='bold 36px system-ui';g.textAlign='center';g.fillText('⛳',W/2,90);g.textAlign='left'}}
function loop(ts){let dt=Math.min(.035,(ts-(lastTs||ts))/1000);lastTs=ts;update(dt);draw();requestAnimationFrame(loop)}
function pointer(e){let b=C.getBoundingClientRect();aim={x:clamp((e.clientX-b.left)/b.width*W,0,W),y:clamp((e.clientY-b.top)/b.height*H,0,H)}}
C.addEventListener('pointermove',pointer);C.addEventListener('pointerdown',e=>{e.preventDefault();pointer(e);C.setPointerCapture(e.pointerId);beginCharge()});C.addEventListener('pointerup',release);C.addEventListener('pointercancel',release);
const keys=new Set();window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['control',' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(keys.has(k))return;keys.add(k);if(k==='control'||k===' ')beginCharge();if(k==='x'||k==='y'){let i=clubs.findIndex(c=>c[0]===$('club').value);setClub(clubs[(i+(k==='x'?1:clubs.length-1))%clubs.length][0])}if(state==='playing'&&['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){let dx=(k==='d'||k==='arrowright')?1:(k==='a'||k==='arrowleft')?-1:0,dy=(k==='s'||k==='arrowdown')?1:(k==='w'||k==='arrowup')?-1:0;let nx=clamp(golfer.x+dx*13,35,965),ny=clamp(golfer.y+dy*13,35,645);golfer.x=nx;golfer.y=ny;if(dist(golfer,ball)>50){golfer.x=ball.x-20;golfer.y=ball.y+17}}});window.addEventListener('keyup',e=>{let k=e.key.toLowerCase();keys.delete(k);if(k==='control'||k===' ')release()});window.addEventListener('blur',()=>{keys.clear();if(charging)release()});$('shoot').addEventListener('pointerdown',e=>{e.preventDefault();beginCharge()});$('shoot').addEventListener('pointerup',release);$('shoot').addEventListener('pointerleave',release);$('start').onclick=start;$('reset').onclick=()=>{if(state==='menu')return;state='playing';$('overlay').style.display='none';makeHole(holeNo)};$('next').onclick=nextHole;$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'♫ ON':'♫ OFF'};$('lang').onchange=()=>{document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T(e.dataset.i));$('help').textContent=T('help');if(state==='menu')$('modalText').textContent=T('welcome');else message(T('ready'));let modes={af:['Vinnige spel','Loopbaan','Oefen'],nl:['Snel spel','Carrière','Oefenen'],ru:['Быстрая игра','Карьера','Тренировка'],en:['Quick play','Career','Practice']}[$('lang').value];[...$('mode').options].forEach((o,i)=>o.textContent=modes[i]);$('course').options[0].textContent={af:'Willekeurige bane',nl:'Willekeurige banen',ru:'Случайные поля',en:'Random courses'}[$('lang').value]};$('club').onchange=updateUI;$('modalButton').onclick=start;$('help').textContent=T('help');$('modalText').textContent=T('welcome');makeHole(0);state='menu';$('overlay').style.display='grid';updateRecords();requestAnimationFrame(loop);
// Deterministic internal sanity tests, accessible as window.mogolTests().
window.mogolTests=()=>{let tests=[];const check=(name,v)=>{tests.push({name,pass:!!v});if(!v)console.error('FAIL',name)};check('club count',clubs.length===6);check('4 course themes',courses.length===4);check('hole pars', [3,4,5].includes(par));check('distance nonnegative',dist(ball,cup)>0);check('surface tee valid',surface({x:110,y:340})!=='out');check('translations',Object.values(tr).every(t=>['welcome','ready','done'].every(k=>!!t[k])));check('record storage guarded',typeof updateRecords==='function');return tests};
